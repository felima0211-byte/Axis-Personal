<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axis Personal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root[data-theme='dark']{
  --bg:#000000;--surface-1:#0b0b0e;--surface-2:#121216;--surface-3:#1a1a20;
  --border:rgba(255,255,255,0.12);--border-strong:rgba(255,255,255,0.24);
  --text:#ffffff;--text-2:#a4a4ad;--text-3:#6c6c76;
  --danger:#f26d6d;--success:#5cc9a0;--warning:#e9b96a;
  --accent-cyan:#6ec1e4;--accent-violet:#a58bdf;--accent-amber:#e9b96a;
  --iridescent:linear-gradient(135deg,#4da9f5 0%,#a58bdf 55%,#e9a6f0 100%);
}
:root[data-theme='light']{
  --bg:#f7f7f5;--surface-1:#ffffff;--surface-2:#f0f0ee;--surface-3:#e7e7e4;
  --border:rgba(0,0,0,0.10);--border-strong:rgba(0,0,0,0.22);
  --text:#0b0b0e;--text-2:#55555d;--text-3:#8a8a93;
  --danger:#c43d3d;--success:#1f8f6a;--warning:#a9741b;
  --accent-cyan:#1c86ad;--accent-violet:#6b4fc0;--accent-amber:#a9741b;
  --iridescent:linear-gradient(135deg,#2f87d6 0%,#7d5fcf 55%,#c46ad6 100%);
}
body{font-family:-apple-system,'Inter',sans-serif;font-size:14px;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:url('axis-bg.png') center center/cover no-repeat;opacity:.18;pointer-events:none;z-index:0}
.sidebar,.main-content,.dialog-overlay,.preview-overlay{position:relative;z-index:1}
.mono{font-family:'JetBrains Mono','Menlo',monospace}

/* SIDEBAR */
.sidebar{width:220px;background:var(--surface-1);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px;gap:4px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-crystal{width:28px;height:42px;border-radius:4px;object-fit:contain;flex-shrink:0;display:block}
.wordmark{display:flex;flex-direction:column;gap:1px}
.wordmark-axis{font-size:15px;font-weight:800;letter-spacing:.08em;color:var(--text)}
.wordmark-sub{font-size:10px;color:var(--text-3);font-family:monospace;letter-spacing:.04em}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13.5px;transition:background 120ms,color 120ms;position:relative;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{color:var(--text);background:var(--surface-2)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--iridescent)}
.nav-icon{width:16px;height:16px;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:auto;font-family:monospace}
.sidebar-bottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.new-conv-btn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);font-size:13px;cursor:pointer;width:100%;transition:background 120ms}
.new-conv-btn:hover{background:var(--surface-2)}
.kbd{font-family:monospace;font-size:10px;color:var(--text-3);background:var(--surface-3);border:1px solid var(--border);border-radius:4px;padding:1px 4px;margin-left:auto}
.live-dot{width:7px;height:7px;background:var(--success);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.theme-toggle{display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--text-3);font-size:12px;cursor:pointer;border-radius:6px;background:transparent;border:none;width:100%}
.theme-toggle:hover{color:var(--text-2)}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.screen{display:none;padding:32px 36px;flex:1;flex-direction:column;gap:24px}
.screen.active{display:flex}

/* BANNER */
.today-banner{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background 120ms}
.today-banner:hover{background:var(--surface-3)}
.today-banner-text{font-size:13px;color:var(--text-2)}
.today-banner-text strong{color:var(--text)}
.today-banner-arrow{margin-left:auto;color:var(--text-3)}

/* HEADERS */
.section-title{font-size:20px;font-weight:700;color:var(--text)}
.filter-row{display:flex;gap:8px}
.filter-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:12px;cursor:pointer;transition:all 120ms}
.filter-btn:hover,.filter-btn.active{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}

/* PROJECT GRID */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.proj-card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:border-color 120ms,background 120ms;display:flex;flex-direction:column;gap:12px;position:relative}
.proj-card:hover{border-color:var(--border-strong);background:var(--surface-2)}
.proj-card-new{border-style:dashed;justify-content:center;align-items:center;gap:8px;color:var(--text-3);min-height:120px}
.proj-card-new:hover{color:var(--text-2)}
.sub-proj-list{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--border);padding-top:10px;margin-top:4px}
.sub-proj-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;font-size:12px;color:var(--text-2);transition:background 120ms}
.sub-proj-item:hover{background:var(--surface-2);color:var(--text)}
.proj-card.drag-over{border-color:var(--accent-cyan)!important;background:rgba(110,193,228,.1)!important;box-shadow:0 0 0 2px rgba(110,193,228,.35)}
.proj-card[draggable=true]{cursor:grab}
.proj-card[draggable=true]:active{cursor:grabbing}
.root-drop-zone{display:none;grid-column:1/-1;border:2px dashed var(--border-strong);border-radius:12px;padding:12px;text-align:center;font-size:12px;color:var(--text-3);transition:all 150ms;user-select:none}
.root-drop-zone.drag-over{border-color:var(--accent-cyan);color:var(--accent-cyan);background:rgba(110,193,228,.06)}
body.is-dragging .root-drop-zone{display:block}
.proj-card-header{display:flex;align-items:center;gap:10px}
.proj-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.proj-name{font-weight:600;font-size:14px}
.proj-tasks-num{font-size:32px;font-weight:800;line-height:1}
.proj-tasks-label{font-size:12px;color:var(--text-3);margin-top:2px}
.proj-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.proj-badge-ok{background:rgba(92,201,160,.15);color:var(--success)}
.proj-badge-late{background:rgba(242,109,109,.15);color:var(--danger)}
.proj-progress{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.proj-progress-bar{height:100%;border-radius:2px;background:var(--iridescent)}
.proj-meta{display:flex;gap:12px;font-size:11px;color:var(--text-3)}
.proj-meta span{font-family:monospace}

/* PROJECT DETAIL */
.proj-detail-header{display:flex;flex-direction:column;gap:6px}
.breadcrumb{font-size:12px;color:var(--text-3);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.breadcrumb span{color:var(--accent-cyan)}
.proj-detail-title{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.proj-detail-dot{width:14px;height:14px;border-radius:50%}
.proj-detail-meta{font-size:12px;color:var(--text-3);font-family:monospace}
.proj-detail-actions{display:flex;gap:8px;margin-top:4px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 120ms,border-color 120ms}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--text);border-bottom-color:var(--accent-cyan)}
.tab-content{display:none;flex-direction:column;gap:8px}
.tab-content.active{display:flex}

/* TASK TABLE */
.task-table{width:100%;border-collapse:collapse}
.task-table th{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);font-family:monospace}
.task-table td{padding:0}
.task-table tr:last-child .task-item{border-bottom:none}
.task-table .task-item{border-bottom:1px solid var(--border);border-radius:0}
.task-table tr:hover .task-item{background:var(--surface-2);border-radius:6px}
.col-title{width:auto}
.col-start,.col-due{width:100px;white-space:nowrap}
.col-countdown{width:90px;text-align:center;white-space:nowrap}
.col-prio{width:80px;white-space:nowrap}
.date-cell{font-size:11px;color:var(--text-3);font-family:monospace;padding:10px 10px}
.date-cell.late{color:var(--danger)}

/* TASK LIST */
.task-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;transition:background 120ms}
.task-item:hover{background:var(--surface-2)}
.task-check{width:16px;height:16px;border:1.5px solid var(--border-strong);border-radius:4px;flex-shrink:0;cursor:pointer;transition:all 120ms;display:flex;align-items:center;justify-content:center;font-size:10px}
.task-check:hover{border-color:var(--success)}
.task-check.done{background:var(--success);border-color:var(--success);color:#000}
.task-title-text{flex:1;font-size:13.5px}
.task-title-text.done-text{color:var(--text-3)}
.task-meta{font-size:11px;color:var(--text-3);font-family:monospace;display:flex;gap:8px;align-items:center}
.prio{font-size:10px;padding:1px 7px;border-radius:20px;font-weight:600}
.prio-urgent{background:rgba(242,109,109,.15);color:var(--danger)}
.prio-high{background:rgba(233,185,106,.15);color:var(--warning)}
.prio-normal{background:rgba(110,193,228,.12);color:var(--accent-cyan)}
.prio-low{color:var(--text-3)}

/* DAYS CHIP */
.days-chip{font-size:10px;padding:1px 7px;border-radius:20px;font-weight:700;font-family:monospace}
.days-late{background:rgba(242,109,109,.15);color:var(--danger)}
.days-today{background:rgba(233,185,106,.18);color:var(--warning)}
.days-soon{background:rgba(233,185,106,.10);color:var(--warning)}
.days-ok{background:rgba(92,201,160,.10);color:var(--success)}

/* TODAY */
.today-section{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.today-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.group-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:0 12px;display:flex;align-items:center;gap:8px}
.group-dot{width:8px;height:8px;border-radius:50%}
.overdue-section{background:rgba(242,109,109,.06);border:1px solid rgba(242,109,109,.2);border-radius:10px;padding:8px}

/* DRAFTS */
.btn-sm{padding:4px 12px;border-radius:6px;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;transition:all 120ms}
.btn-sm:hover{background:var(--surface-2);color:var(--text)}
.btn-confirm{border-color:rgba(92,201,160,.4);color:var(--success)}
.btn-confirm:hover{background:rgba(92,201,160,.1)}
.btn-reject{border-color:rgba(242,109,109,.3);color:var(--danger)}
.btn-reject:hover{background:rgba(242,109,109,.08)}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav-title{font-size:16px;font-weight:700;text-transform:capitalize}
.cal-nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 120ms}
.cal-nav-btn:hover{background:var(--surface-2);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)}
.cal-dow{background:var(--bg);padding:6px 4px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.cal-day{background:var(--surface-1);min-height:88px;padding:6px;display:flex;flex-direction:column;gap:3px;transition:background 120ms;cursor:default;position:relative}
.cal-day.other-month{background:var(--bg)}
.cal-day.other-month .cal-day-num{color:var(--text-3);opacity:.4}
.cal-day.today-day{background:var(--surface-2)}
.cal-day.today-day .cal-day-num{background:var(--iridescent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.cal-day-num{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:2px;line-height:1}
.cal-task-chip{font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity 120ms;font-weight:500;line-height:1.4}
.cal-task-chip:hover{opacity:.8}
.cal-task-chip.done-chip{opacity:.45;text-decoration:line-through}
.cal-more{font-size:10px;color:var(--text-3);padding:1px 4px;cursor:pointer}
.cal-more:hover{color:var(--text-2)}
.cal-day-popup{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:20;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:10px;padding:12px;min-width:200px;max-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.4);display:none;flex-direction:column;gap:6px}
.cal-day-popup.open{display:flex}
.cal-day-popup-title{font-size:11px;font-weight:700;color:var(--text-3);margin-bottom:2px}

/* INLINE ADD */
.add-row{display:flex;gap:8px;padding:8px 12px;align-items:center}
.add-input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:13px;outline:none}
.add-input:focus{border-color:var(--accent-cyan)}
.btn-add{padding:6px 14px;border-radius:7px;background:var(--text);color:var(--bg);border:none;font-size:12px;font-weight:600;cursor:pointer}

/* CONVERSATION */
.conv-item{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.conv-item-header{display:flex;justify-content:space-between;align-items:center}
.conv-excerpt{font-size:12px;color:var(--text-3);white-space:pre-wrap;max-height:80px;overflow:hidden;line-height:1.5}
.conv-actions{display:flex;gap:6px;margin-top:2px}

/* DOCUMENTS */
.btn-upload{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);font-size:13px;cursor:pointer;transition:background 120ms}
.btn-upload:hover{background:var(--surface-3)}
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.doc-card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:border-color 120ms}
.doc-card:hover{border-color:var(--border-strong)}
.doc-preview{width:100%;height:110px;object-fit:cover;display:block}
.doc-icon-preview{width:100%;height:110px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:36px}
.doc-info{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.doc-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:10px;color:var(--text-3);font-family:monospace;display:flex;justify-content:space-between}
.doc-actions{display:flex;gap:4px;margin-top:6px}

/* DIALOG */
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.dialog-overlay.open{display:flex}
.dialog{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:16px;padding:24px;width:440px;display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow-y:auto}
.dialog h3{font-size:16px;font-weight:700}
.dialog label{font-size:12px;color:var(--text-2);display:block;margin-bottom:5px}
.dialog input,.dialog textarea,.dialog select{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13.5px;outline:none;width:100%}
.dialog input:focus,.dialog textarea:focus,.dialog select:focus{border-color:var(--accent-cyan)}
.dialog select option{background:var(--surface-2)}
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color 120ms}
.color-dot.selected,.color-dot:hover{border-color:var(--text)}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-primary{padding:8px 18px;border-radius:8px;background:var(--text);color:var(--bg);border:none;font-size:13px;font-weight:600;cursor:pointer}
.btn-ghost{padding:8px 18px;border-radius:8px;background:transparent;color:var(--text-2);border:1px solid var(--border);font-size:13px;cursor:pointer}
.field-error{font-size:12px;color:var(--danger)}
.priority-row{display:flex;gap:6px}
.prio-opt{padding:5px 12px;border-radius:6px;border:1px solid var(--border);font-size:12px;cursor:pointer;color:var(--text-2);background:transparent}
.prio-opt.sel{border-color:var(--accent-cyan);color:var(--text);background:rgba(110,193,228,.1)}

/* EMPTY */
.empty-state{padding:40px;text-align:center;color:var(--text-3);font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:center}

/* DOC PREVIEW MODAL */
.preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:24px}
.preview-overlay.open{display:flex}
.preview-box{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:16px;width:100%;max-width:880px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.preview-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.preview-title{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-meta{font-size:11px;color:var(--text-3);font-family:monospace;flex-shrink:0}
.preview-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.preview-close:hover{background:var(--surface-2);color:var(--text)}
.preview-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0;min-height:0}
.preview-body img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.preview-body iframe{width:100%;height:100%;border:none;min-height:600px}
.preview-body pre{padding:24px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-2);white-space:pre-wrap;word-break:break-word;line-height:1.6;width:100%;overflow:auto}
.preview-body .csv-table{width:100%;border-collapse:collapse;font-size:12px;font-family:monospace}
.preview-body .csv-table th{background:var(--surface-2);padding:6px 10px;text-align:left;border:1px solid var(--border);font-weight:700;color:var(--text)}
.preview-body .csv-table td{padding:5px 10px;border:1px solid var(--border);color:var(--text-2)}
.preview-body .csv-table tr:hover td{background:var(--surface-2)}
.preview-icon-fallback{display:flex;flex-direction:column;align-items:center;gap:16px;padding:60px;color:var(--text-3)}
.preview-icon-fallback span:first-child{font-size:64px}
.preview-icon-fallback p{font-size:13px;text-align:center;max-width:280px;line-height:1.5}
.doc-card{cursor:pointer}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <img class="logo-crystal" src="axis-icon.png" alt="Axis">
    <div class="wordmark">
      <span class="wordmark-axis">AXIS</span>
      <span class="wordmark-sub mono">Personal</span>
    </div>
  </div>
  <button class="nav-item active" id="nav-dashboard" onclick="showScreen('dashboard')">
    <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
    Projetos

<script>
// ── SUPABASE ──
const SUPA_URL = 'https://wulgdkszppwsnbihozwp.supabase.co'
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1bGdka3N6cHB3c25iaWhvendwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNDI1NTksImV4cCI6MjEwNjYxODU1OX0.7jeUwx48A9UFLWcEO7yEyqIQmlaVZ-untl40-RG6ato'
const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY)

let currentUser = null
let state = { projects: [], tasks: [], messages: [], documents: [], logs: [] }
let currentProjectId = null
let currentFilter = 'active'

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2) }

async function dbUpsert(table, row) {
  if (!currentUser) return
  const { error } = await supa.from(table).upsert({...row, user_id: currentUser.id})
  if (error) console.error('[supa upsert]', table, error.message)
}

async function dbDelete(table, id) {
  if (!currentUser) return
  const { error } = await supa.from(table).delete().eq('id', id)
  if (error) console.error('[supa delete]', table, error.message)
}

async function dbLog(entityType, entityId, action, detail) {
  if (!currentUser) return
  const entry = { id: uid(), entity_type: entityType, entity_id: entityId, action, detail: detail || null, created_at: new Date().toISOString() }
  state.logs.push(entry)
  await dbUpsert('logs', entry)
}

async function loadAll() {
  if (!currentUser) return
  const userId = currentUser.id
  const [p, t, m, d] = await Promise.all([
    supa.from('projects').select('*').eq('user_id', userId).order('created_at'),
    supa.from('tasks').select('*').eq('user_id', userId).order('created_at'),
    supa.from('messages').select('*').eq('user_id', userId).order('created_at'),
    supa.from('documents').select('*').eq('user_id', userId).order('created_at'),
  ])
  state.projects  = p.data || []
  state.tasks     = t.data || []
  state.messages  = m.data || []
  state.documents = d.data || []
  // carregar logs (últimos 200)
  const lg = await supa.from('logs').select('*').eq('user_id', userId).order('created_at', {ascending:false}).limit(200)
  state.logs = lg.data || []
  // auto-migrate localStorage na primeira vez (Supabase vazio)
  if (!state.projects.length && !state.tasks.length) {
    await migrateLocalStorage()
  }
}

async function migrateLocalStorage() {
  const lsP = JSON.parse(localStorage.getItem('axis_projects')  || '[]')
  const lsT = JSON.parse(localStorage.getItem('axis_tasks')     || '[]')
  const lsM = JSON.parse(localStorage.getItem('axis_messages')  || '[]')
  const lsD = JSON.parse(localStorage.getItem('axis_documents') || '[]')
  if (!lsP.length && !lsT.length) return
  const userId = currentUser.id
  const doUp = async (table, rows) => {
    if (!rows.length) return
    const { error } = await supa.from(table).upsert(rows.map(r => ({...r, user_id: userId})))
    if (error) console.warn('migrate', table, error.message)
  }
  await doUp('projects', lsP)
  await doUp('tasks', lsT)
  await doUp('messages', lsM)
  // documentos podem ser grandes — migrar um a um
  for (const doc of lsD) {
    try { await supa.from('documents').upsert({...doc, user_id: userId}) } catch(e) {}
  }
  state.projects  = lsP
  state.tasks     = lsT
  state.messages  = lsM
  state.documents = lsD
}

  btn.disabled = busy; btn.style.opacity = busy ? '.5' : '1'
  btn.textContent = busy ? 'Entrando…' : 'Entrar'

  const msg = document.getElementById('login-msg')
  msg.textContent = text
  msg.style.color = isError ? 'var(--danger)' : 'var(--success)'
  msg.style.display = 'block'
}

async function doLogin() {
  const email    = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  if (!email || !password) { loginShowMsg('Preencha email e senha.', true); return }
  loginSetBusy(true)
  const { error } = await supa.auth.signInWithPassword({ email, password })
  loginSetBusy(false)
  if (error) {
    if (error.message.includes('Invalid login credentials') || error.message.includes('invalid')) {
      loginShowMsg('Email ou senha incorretos.', true)
      // oferece criar conta se ainda não foi exibido
      document.getElementById('login-signup-row').style.display = 'flex'
    } else {
      loginShowMsg('Erro: ' + error.message, true)
    }
  }
  // se ok → onAuthStateChange cuida do resto
}

async function doSignUp() {
  const email    = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  const password2 = document.getElementById('login-password2').value
  if (!email || !password) { loginShowMsg('Preencha email e senha.', true); return }
  if (password !== password2) { loginShowMsg('As senhas não coincidem.', true); return }
  if (password.length < 6)   { loginShowMsg('Senha mínima: 6 caracteres.', true); return }
  const signupBtn = document.querySelector('#login-signup-row button')
  signupBtn.disabled = true; signupBtn.textContent = 'Criando…'
  const { error } = await supa.auth.signUp({ email, password })
  signupBtn.disabled = false; signupBtn.textContent = 'Criar conta'
  if (error) {
    loginShowMsg('Erro: ' + error.message, true)
  } else {
    // tenta logar diretamente após criar
    await supa.auth.signInWithPassword({ email, password })
  }
}

async function signOut() {
  await supa.auth.signOut()
}

supa.auth.onAuthStateChange(async (event, session) => {
  if (session?.user) {
    currentUser = session.user
    document.getElementById('login-screen').style.display = 'none'
    await loadAll()
    document.getElementById('today-date').textContent =
      new Date().toLocaleDateString('pt-BR', {weekday:'long',day:'numeric',month:'long',year:'numeric'})
    const emailShort = currentUser.email?.split('@')[0] || 'eu'
    document.getElementById('sync-label').textContent = emailShort
    renderDashboard()
  } else {
    currentUser = null
    state = { projects: [], tasks: [], messages: [], documents: [] }
    document.getElementById('sync-label').textContent = 'desconectado'
    document.getElementById('login-screen').style.display = 'flex'
    document.getElementById('login-email').disabled = false
    document.getElementById('login-password').value = ''
    document.getElementById('login-btn').disabled = false
    document.getElementById('login-btn').style.opacity = '1'
    document.getElementById('login-btn').textContent = 'Entrar'
    document.getElementById('login-msg').style.display = 'none'
    document.getElementById('login-signup-row').style.display = 'none'
  }
})

// ── DASHBOARD ──
function renderDashboard() {
  renderProjects()
  updateTodayBanner()
}

let draggedProjectId = null

function clearDragState() {
  draggedProjectId = null
  document.body.classList.remove('is-dragging')
  document.querySelectorAll('.proj-card.drag-over, .root-drop-zone.drag-over').forEach(el => el.classList.remove('drag-over'))
  document.querySelectorAll('.proj-card.dragging-src').forEach(el => { el.classList.remove('dragging-src'); el.style.opacity = '' })
}

function renderProjects() {
  const grid = document.getElementById('proj-grid')
  const allActive = state.projects.filter(p => p.status === currentFilter)
  const roots = allActive.filter(p => !p.parent_id)
  const children = allActive.filter(p => !!p.parent_id)
  grid.innerHTML = ''

  // zona de drop para remover do pai — visível só durante drag
  const rootZone = document.createElement('div')
  rootZone.className = 'root-drop-zone'
  rootZone.textContent = '↑ Solte aqui para transformar em projeto raiz'
  rootZone.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; rootZone.classList.add('drag-over') })
  rootZone.addEventListener('dragleave', e => { if (!rootZone.contains(e.relatedTarget)) rootZone.classList.remove('drag-over') })
  rootZone.addEventListener('drop', e => {
    e.preventDefault()
    const src = e.dataTransfer.getData('text/plain') || draggedProjectId
    rootZone.classList.remove('drag-over')
    if (src) {
      const proj = state.projects.find(x => x.id === src)
      if (proj) { proj.parent_id = null; dbUpsert('projects', proj) }
    }
    clearDragState(); renderDashboard()
  })
  grid.appendChild(rootZone)

  if (!roots.length && !children.length) {
    const e = document.createElement('div')
    e.className = 'empty-state'; e.style.gridColumn='1/-1'
    e.innerHTML = 'Nenhum projeto aqui.<br><small>Crie um usando o card abaixo.</small>'
    grid.appendChild(e)
  }

  for (const p of roots) {
    grid.appendChild(buildProjectCard(p, children))
  }

  const newCard = document.createElement('div')
  newCard.className = 'proj-card proj-card-new'
  newCard.onclick = () => openDialog('project')
  newCard.innerHTML = `<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg><span style="font-size:13px">Novo projeto</span>`
  grid.appendChild(newCard)
}

function buildProjectCard(p, allChildren) {
  const tasks = state.tasks.filter(t => t.project_id === p.id && t.status !== 'archived')
  const open  = tasks.filter(t => t.status !== 'done')
  const done  = tasks.filter(t => t.status === 'done').length
  const total = tasks.length
  const progress = total > 0 ? Math.round((done/total)*100) : 0
  const now = new Date().toISOString()
  const overdue = open.filter(t => t.due_at && t.due_at < now)
  const msgs = state.messages.filter(m => m.project_id === p.id)
  const subs = allChildren.filter(c => c.parent_id === p.id)

  const card = document.createElement('div')
  card.className = 'proj-card'
  card.dataset.id = p.id
  card.draggable = true

  card.addEventListener('dragstart', e => {
    draggedProjectId = p.id
    // Safari EXIGE setData — sem isso o drag não inicia
    e.dataTransfer.setData('text/plain', p.id)
    e.dataTransfer.effectAllowed = 'move'
    // adia opacity para captura do ghost image ser limpa
    setTimeout(() => { card.classList.add('dragging-src'); card.style.opacity = '0.4' }, 0)
    document.body.classList.add('is-dragging')
  })

  card.addEventListener('dragend', () => clearDragState())

  card.addEventListener('dragover', e => {
    e.preventDefault() // obrigatório para aceitar drop
    e.dataTransfer.dropEffect = 'move'
    if (draggedProjectId && draggedProjectId !== p.id) {
      card.classList.add('drag-over')
    }
  })

  card.addEventListener('dragleave', e => {
    // só remove se o mouse saiu realmente do card (não de um filho)
    if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over')
  })

  card.addEventListener('drop', e => {
    e.preventDefault()
    e.stopPropagation()
    const src = e.dataTransfer.getData('text/plain') || draggedProjectId
    card.classList.remove('drag-over')
    if (src && src !== p.id && !isAncestor(src, p.id)) {
      const proj = state.projects.find(x => x.id === src)
      if (proj) { proj.parent_id = p.id; dbUpsert('projects', proj) }
    }
    clearDragState()
    renderDashboard()
  })

  card.addEventListener('click', () => { if (!draggedProjectId) openProject(p.id) })

  const subsHTML = subs.length ? `
    <div class="sub-proj-list" onclick="event.stopPropagation()">
      ${subs.slice(0,4).map(s => {
        const st = state.tasks.filter(t=>t.project_id===s.id&&t.status!=='archived'&&t.status!=='done').length
        return `<div class="sub-proj-item" onclick="openProject('${s.id}')">
          <div class="proj-dot" style="background:${s.color};width:8px;height:8px;flex-shrink:0"></div>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span>
          <span style="color:var(--text-3);flex-shrink:0">${st} aberta${st!==1?'s':''}</span>
        </div>`
      }).join('')}
      ${subs.length>4?`<div class="sub-proj-item" style="color:var(--text-3);font-style:italic">+${subs.length-4} mais</div>`:''}
    </div>` : ''

  card.innerHTML = `
    <div class="proj-card-header">
      <div class="proj-dot" style="background:${p.color}"></div>
      <span class="proj-name">${esc(p.name)}</span>
      ${subs.length?`<span style="margin-left:auto;font-size:10px;background:var(--surface-3);border-radius:99px;padding:2px 7px;color:var(--text-3)">${subs.length} sub</span>`:''}
    </div>
    <div>
      <div class="proj-tasks-num">${open.length}</div>
      <div class="proj-tasks-label">tarefas abertas</div>
    </div>
    <div>${overdue.length>0
      ?`<span class="proj-badge proj-badge-late">${overdue.length} atrasada${overdue.length>1?'s':''}</span>`
      :`<span class="proj-badge proj-badge-ok">em dia</span>`}</div>
    <div class="proj-progress"><div class="proj-progress-bar" style="width:${progress}%"></div></div>
    <div class="proj-meta mono"><span>${total} tarefa${total!==1?'s':''}</span><span>${msgs.length} conversa${msgs.length!==1?'s':''}</span><span>${progress}% ok</span></div>
    ${subsHTML}`
  return card
}


function isAncestor(candidateId, targetId) {
  // retorna true se candidateId é ancestral de targetId (evita loops)
  let cur = state.projects.find(p => p.id === targetId)
  while (cur && cur.parent_id) {
    if (cur.parent_id === candidateId) return true
    cur = state.projects.find(p => p.id === cur.parent_id)
  }
  return false
}

function updateTodayBanner() {
  const today = new Date(); today.setHours(0,0,0,0)
  const todayEnd = new Date(today); todayEnd.setHours(23,59,59,999)
  const tasks = state.tasks.filter(t => t.status!=='done'&&t.status!=='archived')
  const todayTasks = tasks.filter(t => t.due_at && new Date(t.due_at)>=today && new Date(t.due_at)<=todayEnd)
  const overdue = tasks.filter(t => t.due_at && new Date(t.due_at)<today)
  let txt = `<strong>${todayTasks.length} tarefa${todayTasks.length!==1?'s':''}</strong> para hoje`
  if (overdue.length) txt += ` · <strong style="color:var(--danger)">${overdue.length} atrasada${overdue.length>1?'s':''}</strong>`
  document.getElementById('today-banner-text').innerHTML = txt
}

// ── TASK TABLE (visão geral) ──
function daysLabel(due_at, isDone) {
  if (!due_at || isDone) return ''
  const now = new Date(); now.setHours(0,0,0,0)
  const [y,m,d] = due_at.slice(0,10).split('-')
  const due = new Date(+y,+m-1,+d)
  const diff = Math.round((due-now)/86400000)
  if (diff<0)  return `<span class="days-chip days-late">${Math.abs(diff)}d atraso</span>`
  if (diff===0) return `<span class="days-chip days-today">hoje</span>`
  if (diff===1) return `<span class="days-chip days-soon">amanhã</span>`
  if (diff<=3)  return `<span class="days-chip days-soon">${diff}d</span>`
  return `<span class="days-chip days-ok">${diff}d</span>`
}

function taskTableHTML(tasks) {
  if (!tasks.length) return ''
  const rows = tasks.map(task => {
    const isDone = task.status==='done'
    const prioClass={urgent:'prio-urgent',high:'prio-high',normal:'prio-normal',low:'prio-low'}[task.priority]||'prio-normal'
    const prioLabel={urgent:'urgente',high:'alta',normal:'normal',low:'baixa'}[task.priority]||''
    const now = new Date().toISOString()
    const isLate = task.due_at && task.due_at<now && !isDone
    return `<tr onclick="openTaskEdit('${task.id}')" style="cursor:pointer">
      <td><div class="task-item" style="${isLate?'background:rgba(242,109,109,.04)':''}">
        <div class="task-check ${isDone?'done':''}" onclick="event.stopPropagation();toggleTask('${task.id}')">${isDone?'✓':''}</div>
        <span class="task-title-text ${isDone?'done-text':''}">${esc(task.title)}</span>
      </div></td>
      <td class="date-cell">${task.start_at?fmtDate(task.start_at):'<span style="opacity:.3">—</span>'}</td>
      <td class="date-cell ${isLate?'late':''}">${task.due_at?fmtDate(task.due_at):'<span style="opacity:.3">—</span>'}</td>
      <td style="text-align:center;padding:6px 10px">${daysLabel(task.due_at,isDone)}</td>
      <td style="padding:6px 10px"><span class="prio ${prioClass}">${prioLabel}</span></td>
    </tr>`
  }).join('')
  return `<table class="task-table">
    <thead><tr><th>Tarefa</th><th>Início</th><th>Prazo</th><th style="text-align:center">Tempo</th><th>Prioridade</th></tr></thead>
    <tbody>${rows}</tbody></table>`
}

function renderProjectOverview() {
  const el = document.getElementById('tab-overview')
  const now = new Date().toISOString()
  const tasks = state.tasks.filter(t => t.project_id===currentProjectId && t.status!=='archived')
  const overdue = tasks.filter(t => t.due_at && t.due_at<now && t.status!=='done')
  const open = tasks.filter(t => t.status!=='done')
  const done = tasks.filter(t => t.status==='done')
  const msgs = state.messages.filter(m => m.project_id===currentProjectId)
  const subs = state.projects.filter(p => p.parent_id===currentProjectId && p.status!=='archived')

  document.getElementById('proj-detail-meta').textContent =
    `${open.length} abertas · ${done.length} concluídas · ${msgs.length} conversa${msgs.length!==1?'s':''}${subs.length?` · ${subs.length} sub-projeto${subs.length!==1?'s':''}`:''}`
  const late = document.getElementById('proj-detail-late')
  if (overdue.length){late.textContent=`${overdue.length} atrasada${overdue.length>1?'s':''}`;late.style.display=''}
  else late.style.display='none'

  let html = ''

  // ── Sub-projetos ──
  if (subs.length) {
    const subCards = subs.map(s => {
      const st    = state.tasks.filter(t=>t.project_id===s.id&&t.status!=='archived')
      const sOpen = st.filter(t=>t.status!=='done').length
      const sDone = st.filter(t=>t.status==='done').length
      const sTotal = st.length
      const sProg = sTotal>0?Math.round((sDone/sTotal)*100):0
      const sOver = st.filter(t=>t.due_at&&t.due_at<now&&t.status!=='done').length
      const sMsgs = state.messages.filter(m=>m.project_id===s.id).length
      return `<div onclick="openProject('${s.id}')" class="proj-card" style="cursor:pointer;min-height:0;gap:10px">
        <div class="proj-card-header">
          <div class="proj-dot" style="background:${s.color}"></div>
          <span class="proj-name">${esc(s.name)}</span>
        </div>
        <div>
          <div class="proj-tasks-num" style="font-size:22px">${sOpen}</div>
          <div class="proj-tasks-label">tarefas abertas</div>
        </div>
        <div>${sOver>0
          ?`<span class="proj-badge proj-badge-late">${sOver} atrasada${sOver!==1?'s':''}</span>`
          :`<span class="proj-badge proj-badge-ok">em dia</span>`}
        </div>
        <div class="proj-progress"><div class="proj-progress-bar" style="width:${sProg}%;background:${s.color}"></div></div>
        <div class="proj-meta mono"><span>${sTotal} tarefa${sTotal!==1?'s':''}</span><span>${sMsgs} conversa${sMsgs!==1?'s':''}</span><span>${sProg}% ok</span></div>
      </div>`
    }).join('')

    html += `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="group-label"><div class="group-dot" style="background:var(--accent-violet)"></div>Sub-projetos</div>
        <button class="btn-sm" onclick="openSubProjectDialog()" style="font-size:11px">+ Novo</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">${subCards}</div>
    </div>
    <div style="border-top:1px solid var(--border);margin-bottom:16px"></div>`
  }

  // ── Tarefas ──
  if (overdue.length) html+=`<div class="overdue-section today-section" style="margin-bottom:8px"><div class="group-label" style="color:var(--danger);margin-bottom:4px"><div class="group-dot" style="background:var(--danger)"></div>Atrasadas</div>${taskTableHTML(overdue)}</div>`
  const upcoming = open.filter(t=>!overdue.find(o=>o.id===t.id))
  if (upcoming.length) html+=`<div class="today-section"><div class="group-label" style="margin-bottom:4px"><div class="group-dot" style="background:var(--text-3)"></div>Abertas</div>${taskTableHTML(upcoming)}</div>`
  if (done.length) html+=`<div class="today-section" style="margin-top:8px"><div class="group-label" style="margin-bottom:4px"><div class="group-dot" style="background:var(--success)"></div>Concluídas</div>${taskTableHTML(done)}</div>`
  if (!tasks.length && !subs.length) html='<div class="empty-state">Nenhuma tarefa ainda.<br><small>Vá para a aba Tarefas para criar.</small></div>'

  el.innerHTML = html
}

  const el = document.getElementById('proj-tasks-list')
  const tasks = state.tasks.filter(t=>t.project_id===currentProjectId&&t.status!=='archived')
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))
  if (!tasks.length){el.innerHTML='<div class="empty-state">Nenhuma tarefa ainda.</div>';return}

    const isDone=task.status==='done'
    const prioClass={urgent:'prio-urgent',high:'prio-high',normal:'prio-normal',low:'prio-low'}[task.priority]||'prio-normal'
    const prioLabel={urgent:'urgente',high:'alta',normal:'normal',low:'baixa'}[task.priority]||''
    const now=new Date().toISOString(); const isLate=task.due_at&&task.due_at<now&&!isDone
    return `<div class="task-item" onclick="openTaskEdit('${task.id}')" style="cursor:pointer;${isLate?'background:rgba(242,109,109,.04)':''}">
      <div class="task-check ${isDone?'done':''}" onclick="event.stopPropagation();toggleTask('${task.id}')">${isDone?'✓':''}</div>
      <span class="task-title-text ${isDone?'done-text':''}">${esc(task.title)}</span>
      <div class="task-meta">
        ${task.due_at?`<span style="${isLate?'color:var(--danger)':''}">${fmtDate(task.due_at)}</span>`:''}
        ${daysLabel(task.due_at,isDone)}
        <span class="prio ${prioClass}">${prioLabel}</span>
      </div></div>`
  }).join('')
}

function renderProjectConversations() {
  const el = document.getElementById('proj-conv-list')

    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))

      <span style="font-size:12px;color:var(--text-2)">${m.requester_name?esc(m.requester_name)+' · ':''}<span class="mono" style="color:var(--text-3)">${fmtDateTime(m.created_at)}</span></span>
    </div>
    <div class="conv-excerpt">${esc(m.content)}</div>
    <div class="conv-actions">
      <button class="btn-sm" onclick="openConvEdit('${m.id}')">Editar</button>

// ── TASK TOGGLE / ADD / EDIT ──
function toggleTask(id) {
  const task = state.tasks.find(t=>t.id===id); if(!task)return
  task.status = task.status==='done'?'open':'done'
  task.updated_at = new Date().toISOString()
  dbUpsert('tasks', task)
  dbLog('task', id, task.status==='done'?'concluída':'reaberta', task.title)
  const screen = document.querySelector('.screen.active')?.id
  if (screen==='screen-today') { renderToday(); updateTodayBanner(); return }
  const activeTab = document.querySelector('.tab-content.active')?.id
  if (activeTab==='tab-overview') renderProjectOverview()
  else if (activeTab==='tab-tasks') renderProjectTasks()
  updateTodayBanner()
}

function addTaskInline() {
  const input = document.getElementById('new-task-input')
  const title = input.value.trim(); if(!title)return

async function deleteCurrentProject() {
  if (!currentProjectId) return
  const p = state.projects.find(x=>x.id===currentProjectId); if(!p)return

  const deletedTaskIds   = state.tasks.filter(t=>t.project_id===currentProjectId).map(t=>t.id)

  state.messages  = state.messages.filter(m=>m.project_id!==currentProjectId)

// ── TODAY ──
function fmtUpdatedAt(iso) {
  if (!iso) return ''
  const d = new Date(iso)
  const now = new Date()
  const diffMs = now - d
  const diffMin = Math.floor(diffMs / 60000)
  if (diffMin < 1)  return 'agora'
  if (diffMin < 60) return `${diffMin}min atrás`
  const sameDay = d.toDateString() === now.toDateString()
  const hh = d.getHours().toString().padStart(2,'0')
  const mm = d.getMinutes().toString().padStart(2,'0')
  if (sameDay) return `${hh}:${mm}`
  return `${fmtDate(iso)} ${hh}:${mm}`
}

function renderToday() {
  const el=document.getElementById('today-content')
  const today=new Date();today.setHours(0,0,0,0)
  const todayEnd=new Date(today);todayEnd.setHours(23,59,59,999)
  const allOpen=state.tasks.filter(t=>t.status!=='done'&&t.status!=='archived')
  // ordena por updated_at desc (mais recentemente modificada primeiro)
  const sortByUpdated = arr => [...arr].sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at))
  const overdue=sortByUpdated(allOpen.filter(t=>t.due_at&&new Date(t.due_at)<today))
  const overdueIds=new Set(overdue.map(t=>t.id))
  let html=''
  if (overdue.length) {
    html+=`<div class="overdue-section today-section" style="margin-bottom:16px">
      <div class="group-label" style="color:var(--danger)"><div class="group-dot" style="background:var(--danger)"></div>Atrasadas</div>
      <div>${overdue.map(t=>taskSimpleHTML(t)).join('')}</div></div>`
  }
  const remaining=allOpen.filter(t=>!overdueIds.has(t.id))
  const byProject={}
  remaining.forEach(t=>{const k=t.project_id||'__none__';if(!byProject[k])byProject[k]=[];byProject[k].push(t)})
  // ordena grupos pelo updated_at mais recente de qualquer tarefa do grupo
  const sorted=Object.entries(byProject).sort(([,a],[,b])=>{
    const latestOf = ts => Math.max(...ts.map(t=>new Date(t.updated_at||t.created_at)))
    return latestOf(b) - latestOf(a)
  })
  for (const [pid,pts] of sorted) {
    const proj=state.projects.find(p=>p.id===pid)
    const color=proj?.color||'var(--text-3)'; const name=proj?.name||'Sem projeto'
    const tc=pts.filter(t=>t.due_at&&new Date(t.due_at)>=today&&new Date(t.due_at)<=todayEnd).length
    const badge=tc>0?`<span style="font-size:10px;background:rgba(233,185,106,.2);color:var(--warning);padding:1px 6px;border-radius:99px;font-weight:700;margin-left:4px">${tc} hoje</span>`:''
    html+=`<div class="today-section">
      <div class="group-label"><div class="group-dot" style="background:${color}"></div>${esc(name)}${badge}</div>
      <div>${sortByUpdated(pts).map(t=>taskSimpleHTML(t)).join('')}</div></div>`
  }
  if (!allOpen.length) html='<div class="empty-state">Nenhuma tarefa aberta. 🎉</div>'
  el.innerHTML=html
}

function taskSimpleHTML(task) {
  const isDone=task.status==='done'
  const prioClass={urgent:'prio-urgent',high:'prio-high',normal:'prio-normal',low:'prio-low'}[task.priority]||'prio-normal'
  const prioLabel={urgent:'urgente',high:'alta',normal:'normal',low:'baixa'}[task.priority]||''
  const nowIso=new Date().toISOString(); const isLate=task.due_at&&task.due_at<nowIso&&!isDone
  const updatedLabel = fmtUpdatedAt(task.updated_at||task.created_at)
  return `<div class="task-item" onclick="openTaskEdit('${task.id}')">
    <div class="task-check ${isDone?'done':''}" onclick="event.stopPropagation();toggleTask('${task.id}')">${isDone?'✓':''}</div>
    <span class="task-title-text ${isDone?'done-text':''}">${esc(task.title)}</span>
    <div class="task-meta">
      ${task.due_at?`<span style="${isLate?'color:var(--danger)':''}">${fmtDate(task.due_at)}</span>`:''}
      ${daysLabel(task.due_at,isDone)}
      <span class="prio ${prioClass}">${prioLabel}</span>
      <span style="margin-left:4px;opacity:.55;font-size:10px">${updatedLabel}</span>
    </div></div>`
}


// ── CALENDAR ──
let calYear  = new Date().getFullYear()
let calMonth = new Date().getMonth() // 0-indexed
const CAL_MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
const CAL_DOWS   = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']

function renderCalendar() {
  const el = document.getElementById('calendar-content')
  el.innerHTML = buildCalendarHTML()
}

function calNav(dir) {
  calMonth += dir
  if (calMonth > 11) { calMonth = 0; calYear++ }
  if (calMonth < 0)  { calMonth = 11; calYear-- }
  document.getElementById('calendar-content').innerHTML = buildCalendarHTML()
}

function buildCalendarHTML() {
  const today = new Date(); today.setHours(0,0,0,0)
  const tasks  = state.tasks.filter(t => t.due_at && t.status !== 'archived')

  // índice de tarefas por data YYYY-MM-DD
  const byDate = {}
  tasks.forEach(t => {
    const key = t.due_at.slice(0,10)
    if (!byDate[key]) byDate[key] = []
    byDate[key].push(t)
  })

  // primeiro dia do mês (ajuste para semana começar na seg)
  const firstDay = new Date(calYear, calMonth, 1)
  const lastDay  = new Date(calYear, calMonth+1, 0)
  let startDow = firstDay.getDay() // 0=dom
  startDow = startDow === 0 ? 6 : startDow - 1 // converte para seg=0

  // cabeçalho
  let html = `
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
    <span class="cal-nav-title">${CAL_MONTHS[calMonth]} ${calYear}</span>
    <button class="cal-nav-btn" onclick="calNav(1)">›</button>
  </div>
  <div class="cal-grid">
    ${CAL_DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}`

  // dias do mês anterior
  const prevLast = new Date(calYear, calMonth, 0).getDate()
  for (let i = startDow - 1; i >= 0; i--) {
    const d = prevLast - i
    const m = calMonth === 0 ? 12 : calMonth
    const y = calMonth === 0 ? calYear - 1 : calYear
    const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    html += dayCell(d, key, byDate, today, true)
  }

  // dias do mês atual
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const dt  = new Date(calYear, calMonth, d)
    html += dayCell(d, key, byDate, today, false, dt.getTime() === today.getTime())
  }

  // completar última linha com dias do próximo mês
  const totalCells = startDow + lastDay.getDate()
  const remaining  = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7)
  for (let d = 1; d <= remaining; d++) {
    const m = calMonth === 11 ? 1 : calMonth + 2
    const y = calMonth === 11 ? calYear + 1 : calYear
    const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    html += dayCell(d, key, byDate, today, true)
  }

  html += '</div>'
  return html
}

function dayCell(dayNum, key, byDate, today, otherMonth, isToday=false) {
  const dt = new Date(key + 'T12:00:00')
  const isPast = dt < today && !isToday
  const dayTasks = byDate[key] || []
  const MAX_VISIBLE = 3

  let cls = 'cal-day'
  if (otherMonth) cls += ' other-month'
  if (isToday)    cls += ' today-day'

  let chipsHTML = ''
  dayTasks.slice(0, MAX_VISIBLE).forEach(t => {
    const proj  = state.projects.find(p => p.id === t.project_id)
    const color = proj?.color || '#6c6c76'
    const isDone = t.status === 'done'
    const isLate = !isDone && isPast
    const bg = isLate ? 'rgba(242,109,109,.18)' : `${color}22`
    const fg = isLate ? 'var(--danger)' : color
    chipsHTML += `<div class="cal-task-chip ${isDone?'done-chip':''}" style="background:${bg};color:${fg}" onclick="event.stopPropagation();openTaskEdit('${t.id}')" title="${esc(t.title)}">${esc(t.title)}</div>`
  })

  let moreHTML = ''
  if (dayTasks.length > MAX_VISIBLE) {
    moreHTML = `<div class="cal-more" onclick="event.stopPropagation();toggleDayPopup('${key}')">+${dayTasks.length - MAX_VISIBLE} mais</div>`
  }

  // popup com todas as tarefas do dia
  let popupHTML = ''
  if (dayTasks.length > MAX_VISIBLE) {
    const extraTasks = dayTasks.slice(MAX_VISIBLE).map(t => {
      const proj = state.projects.find(p => p.id === t.project_id)
      const color = proj?.color || '#6c6c76'
      const isDone = t.status === 'done'
      return `<div class="cal-task-chip ${isDone?'done-chip':''}" style="background:${color}22;color:${color};margin-bottom:2px" onclick="openTaskEdit('${t.id}')">${esc(t.title)}</div>`
    }).join('')
    popupHTML = `<div class="cal-day-popup" id="popup-${key}">
      <div class="cal-day-popup-title">${dayNum} ${CAL_MONTHS[calMonth]?.slice(0,3) || ''} — todas as tarefas</div>
      ${dayTasks.map(t=>{const proj=state.projects.find(p=>p.id===t.project_id);const color=proj?.color||'#6c6c76';const isDone=t.status==='done';return`<div class="cal-task-chip ${isDone?'done-chip':''}" style="background:${color}22;color:${color}" onclick="openTaskEdit('${t.id}')">${esc(t.title)}</div>`}).join('')}
    </div>`
  }

  return `<div class="${cls}" onclick="closeDayPopups()">${popupHTML}<div class="cal-day-num">${dayNum}</div>${chipsHTML}${moreHTML}</div>`
}

function toggleDayPopup(key) {
  closeDayPopups()
  const el = document.getElementById('popup-' + key)
  if (el) el.classList.add('open')
}

function closeDayPopups() {
  document.querySelectorAll('.cal-day-popup.open').forEach(el => el.classList.remove('open'))
}

function fileIcon(name){return FILE_ICONS[name.split('.').pop().toLowerCase()]||'📎'}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}

let docsView = 'grid' // 'grid' | 'list'

function handleFileUpload(input) {
  const files = Array.from(input.files)
  if (!files.length) return
  const el = document.getElementById('proj-docs-list')
  el.innerHTML = '<div style="padding:20px;color:var(--text-3);font-size:13px">Carregando arquivos…</div>'
  let pending = files.length
  files.forEach(file => {
    const reader = new FileReader()
    reader.onerror = () => { pending--; if(pending===0){renderProjectDocuments();updateDocsBadge()} }
    reader.onload = async e => {
      const doc = {id:uid(),project_id:currentProjectId,name:file.name,type:file.type,size:file.size,data:e.target.result,created_at:new Date().toISOString()}
      state.documents.push(doc)
      try {
        await dbUpsert('documents', doc)
      } catch(err) {
        state.documents = state.documents.filter(d => d.id !== doc.id)
        el.innerHTML='<div style="padding:20px;color:var(--danger);font-size:13px">Arquivo grande demais para sincronizar. Tente um menor.</div>'
      }
      pending--; if(pending===0){renderProjectDocuments();updateDocsBadge()}
    }
    reader.readAsDataURL(file)
  })
  input.value=''
}

    }
    return `<div onclick="openDocPreview('${doc.id}')" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 120ms" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
      <span style="font-size:22px;flex-shrink:0">${doc.type.startsWith('image/')?'🖼️':fileIcon(doc.name)}</span>
      <span style="flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(doc.name)}">${esc(doc.name)}</span>
      <span style="font-size:11px;color:var(--text-3);font-family:monospace;flex-shrink:0">${fmtSize(doc.size)}</span>
      <span style="font-size:11px;color:var(--text-3);font-family:monospace;flex-shrink:0">${fmtDate(doc.created_at)}</span>
      <div onclick="event.stopPropagation()" style="display:flex;gap:4px;flex-shrink:0">
        <a href="${doc.data}" download="${esc(doc.name)}" class="btn-sm" style="text-decoration:none;font-size:11px">↓</a>
        <button class="btn-sm btn-reject" style="font-size:11px" onclick="deleteDoc('${doc.id}')">✕</button>
      </div>
    </div>`
  }

  if (docsView === 'grid') {
    el.innerHTML = `<div class="docs-grid">${docs.map(docCard).join('')}</div>`
  } else {
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:2px">${docs.map(docRow).join('')}</div>`
  }
}

function setDocsView(v, btn) {
  docsView = v
  document.querySelectorAll('.docs-view-btn').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  renderProjectDocuments()
}

function openDocPreview(id) {
  const doc = state.documents.find(d => d.id === id); if (!doc) return
  document.getElementById('preview-title').textContent = doc.name
  document.getElementById('preview-meta').textContent = fmtSize(doc.size) + ' · ' + fmtDate(doc.created_at)
  const dl = document.getElementById('preview-download')
  dl.href = doc.data; dl.download = doc.name
  const body = document.getElementById('preview-body')
  const ext = doc.name.split('.').pop().toLowerCase()

  if (doc.type.startsWith('image/')) {
    body.innerHTML = `<img src="${doc.data}" style="max-width:100%;max-height:75vh;object-fit:contain;display:block">`
  } else if (doc.type === 'application/pdf') {
    body.innerHTML = `<iframe src="${doc.data}" style="width:100%;height:75vh;border:none"></iframe>`
  } else if (ext === 'csv' || doc.type === 'text/csv') {
    const raw = atob(doc.data.split(',')[1])
    const rows = raw.split('\n').filter(r=>r.trim()).map(r=>r.split(','))
    const header = rows[0] || []
    const body2 = rows.slice(1)
    body.innerHTML = `<div style="overflow:auto;width:100%;max-height:75vh;padding:16px">
      <table class="csv-table">
        <thead><tr>${header.map(h=>`<th>${esc(h.trim())}</th>`).join('')}</tr></thead>
        <tbody>${body2.map(r=>`<tr>${r.map(c=>`<td>${esc(c.trim())}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`
  } else if (ext === 'txt' || doc.type.startsWith('text/')) {
    const raw = atob(doc.data.split(',')[1])
    body.innerHTML = `<pre>${esc(raw)}</pre>`
  } else {
    body.innerHTML = `<div class="preview-icon-fallback">
      <span>${fileIcon(doc.name)}</span>
      <p>Pré-visualização não disponível para este formato.<br>Use o botão <strong>↓ Baixar</strong> para abrir.</p>
    </div>`
  }
  document.getElementById('preview-overlay').classList.add('open')
}

function closePreview(e) { if (e.target===e.currentTarget) document.getElementById('preview-overlay').classList.remove('open') }

function deleteDoc(id) {
  state.documents = state.documents.filter(d=>d.id!==id)
  dbDelete('documents', id)
  renderProjectDocuments(); updateDocsBadge()
}

function saveLink() {
  const name = document.getElementById('link-name').value.trim()
  const url  = document.getElementById('link-url').value.trim()
  const err  = document.getElementById('link-error')
  if (!url) { err.textContent='Informe a URL.'; err.style.display='block'; return }
  err.style.display='none'
  const doc = {id:uid(), project_id:currentProjectId, name:name||url, url:url, kind:'link', type:'link', size:0, data:null, created_at:new Date().toISOString()}
  state.documents.push(doc)
  dbUpsert('documents', doc)
  document.getElementById('link-name').value = ''
  document.getElementById('link-url').value  = ''
  closeDialog('link')
  renderProjectDocuments(); updateDocsBadge()
}

function updateDocsBadge() {
  const count = state.documents.filter(d=>d.project_id===currentProjectId).length
  const badge = document.getElementById('docs-badge'); if(!badge)return
  if(count>0){badge.textContent=count;badge.style.display=''}else badge.style.display='none'
}

// ── HELPERS ──
function openDialog(id){if(id!=='task')populateProjectSelects();document.getElementById('dialog-'+id).classList.add('open')}
function closeDialog(id){document.getElementById('dialog-'+id).classList.remove('open')}
function closeDialogIfBg(e,id){if(e.target===e.currentTarget)closeDialog(id)}
function selectColor(el){document.querySelectorAll('#color-picker .color-dot').forEach(d=>d.classList.remove('selected'));el.classList.add('selected')}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}

function exportData() {
  const data = {
    version: 1,
    exported_at: new Date().toISOString(),
    axis_projects:  state.projects,
    axis_tasks:     state.tasks,
    axis_messages:  state.messages,
    axis_documents: state.documents,
  }
  const json = JSON.stringify(data, null, 2)
  const blob = new Blob([json], {type: 'application/json'})
  const url  = URL.createObjectURL(blob)
  const a    = document.createElement('a')
  const date = new Date().toISOString().slice(0,10)
  a.href = url; a.download = `axis-backup-${date}.json`
  a.click(); URL.revokeObjectURL(url)
}

function importData(input) {
  const file = input.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result)
      if (!data.axis_projects && !data.axis_tasks) { alert('Arquivo inválido.'); return }
      if (!confirm(`Importar backup de ${data.exported_at?.slice(0,10) || 'data desconhecida'}?\n\nOs dados atuais serão substituídos.`)) return
      const userId = currentUser?.id
      if (!userId) { alert('Faça login primeiro.'); return }
      const doUp = async (table, rows) => {
        if (!rows?.length) return
        await supa.from(table).upsert(rows.map(r => ({...r, user_id: userId})))
      }
      await doUp('projects',  data.axis_projects)
      await doUp('tasks',     data.axis_tasks)
      await doUp('messages',  data.axis_messages)
      for (const doc of (data.axis_documents || [])) {
        try { await supa.from('documents').upsert({...doc, user_id: userId}) } catch(e) {}
      }
      await loadAll()
      showScreen('dashboard'); renderDashboard()
      alert('Dados importados com sucesso!')
    } catch(err) { alert('Erro ao ler o arquivo. Verifique se é um backup válido.') }
  }
  reader.readAsText(file)
  input.value = ''
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(iso){if(!iso)return'';const[y,m,d]=iso.slice(0,10).split('-');return`${d}/${m}/${y}`}
function fmtDateTime(iso){if(!iso)return'';const d=new Date(iso);return`${fmtDate(iso)} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`}

document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return
  if(e.key==='n'||e.key==='N')openDialog('conv')
  if(e.key==='Escape'){document.querySelectorAll('.dialog-overlay.open').forEach(d=>d.classList.remove('open'));document.getElementById('preview-overlay').classList.remove('open')}
})
</script>
